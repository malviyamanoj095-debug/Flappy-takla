<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Flappy Bird Retro Arcade</title>
    <meta
      name="description"
      content="A complete, fully playable classic Flappy Bird retro arcade game with procedural canvas graphics and 8-bit Web Audio synthesizer."
    />
    <meta property="og:title" content="Flappy Bird Retro Arcade" />
    <meta
      property="og:description"
      content="A complete, fully playable classic Flappy Bird retro arcade game with procedural canvas graphics and 8-bit Web Audio synthesizer."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
        font-family: 'Press Start 2P', system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #game-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 12px;
      }

      #game-container {
        position: relative;
        width: 100%;
        max-width: 360px;
        aspect-ratio: 360 / 640;
        max-height: min(100vh - 24px, 640px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 0 2px rgba(255, 255, 255, 0.12),
          0 0 40px rgba(78, 192, 202, 0.2);
        border-radius: 14px;
        overflow: hidden;
        background-color: #4ec0ca;
      }

      @media (max-height: 660px) {
        #game-container {
          max-height: 100vh;
          border-radius: 0;
          box-shadow: none;
          max-width: calc(100vh * (360 / 640));
        }
        #game-wrapper {
          padding: 0;
        }
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        cursor: pointer;
      }

      /* Audio control button overlay */
      #sound-toggle {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.45);
        border: 2px solid rgba(255, 255, 255, 0.6);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        cursor: pointer;
        z-index: 20;
        transition: transform 0.1s ease, background 0.2s ease;
        backdrop-filter: blur(4px);
        outline: none;
      }

      #sound-toggle:active {
        transform: scale(0.9);
        background: rgba(0, 0, 0, 0.7);
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="game-container">
        <canvas id="gameCanvas" width="360" height="640"></canvas>
        <button id="sound-toggle" aria-label="Toggle Sound" title="Toggle Sound">🔊</button>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        // --- CONSTANTS & CONFIGURATION ---
        const WIDTH = 360;
        const HEIGHT = 640;
        const GROUND_Y = 528;
        const PIPE_WIDTH = 54;
        const PIPE_COLLAR_WIDTH = 62;
        const PIPE_COLLAR_HEIGHT = 26;
        const PIPE_GAP = 140;
        const PIPE_INTERVAL = 195; // distance between pipe spawns
        const SPEED = 2.4; // horizontal speed

        const GRAVITY = 0.42;
        const JUMP_VELOCITY = -7.4;
        const MAX_FALL_SPEED = 9.8;
        const BIRD_RADIUS = 13;
        const BIRD_X = 90;

        // --- GAME STATES ---
        const STATE = {
          START: 0,
          PLAYING: 1,
          GAMEOVER: 2,
        };

        let currentState = STATE.START;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappy_best_score') || '0', 10);
        let isNewHigh = false;
        let gameOverTime = 0;
        let shakeFrames = 0;
        let flashAlpha = 0;
        let scoreScale = 1.0;
        let frameCount = 0;
        let soundMuted = false;

        // --- AUDIO SYNTHESIZER (WEB AUDIO API) ---
        let audioCtx = null;

        function getAudioContext() {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
              audioCtx = new AudioContextClass();
            }
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          return audioCtx;
        }

        function playFlapSound() {
          if (soundMuted) return;
          const ctx = getAudioContext();
          if (!ctx) return;

          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.09);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.1);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + 0.11);
        }

        function playScoreSound() {
          if (soundMuted) return;
          const ctx = getAudioContext();
          if (!ctx) return;

          const now = ctx.currentTime;

          // Note 1: B5 (988Hz)
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(987.77, now);
          gain1.gain.setValueAtTime(0.28, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.13);

          // Note 2: E6 (1319Hz) - Delayed slightly
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(1318.51, now + 0.08);
          gain2.gain.setValueAtTime(0.001, now);
          gain2.gain.setValueAtTime(0.32, now + 0.08);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.08);
          osc2.stop(now + 0.32);
        }

        function playHitSound() {
          if (soundMuted) return;
          const ctx = getAudioContext();
          if (!ctx) return;

          const now = ctx.currentTime;

          // Low thud
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);

          gain.gain.setValueAtTime(0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + 0.17);

          // Noise burst
          try {
            const bufferSize = ctx.sampleRate * 0.06;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = ctx.createBufferSource();
            whiteNoise.buffer = buffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, now);

            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.35, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

            whiteNoise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(ctx.destination);

            whiteNoise.start(now);
            whiteNoise.stop(now + 0.07);
          } catch (e) {}
        }

        function playDieSound() {
          if (soundMuted) return;
          const ctx = getAudioContext();
          if (!ctx) return;

          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(540, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);

          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + 0.4);
        }

        // --- CANVAS SETUP WITH HIGH-DPI SUPPORT ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const soundToggleBtn = document.getElementById('sound-toggle');

        soundToggleBtn.addEventListener('pointerdown', function (e) {
          e.stopPropagation();
          getAudioContext();
          soundMuted = !soundMuted;
          soundToggleBtn.textContent = soundMuted ? '🔇' : '🔊';
        });

        let dpr = 1;
        function resizeCanvas() {
          dpr = Math.min(window.devicePixelRatio || 1, 3);
          canvas.width = WIDTH * dpr;
          canvas.height = HEIGHT * dpr;
          ctx.resetTransform();
          ctx.scale(dpr, dpr);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- BACKGROUND ENTITIES ---
        const clouds = [
          { x: 40, y: 60, scale: 1.1, speed: 0.25 },
          { x: 190, y: 110, scale: 0.85, speed: 0.18 },
          { x: 310, y: 45, scale: 1.3, speed: 0.3 },
          { x: 450, y: 90, scale: 0.95, speed: 0.22 },
        ];

        let groundOffset = 0;
        let cityOffset = 0;

        // Particle system for feather flap effects & star glints
        const particles = [];
        function createFeatherPuff(x, y) {
          for (let i = 0; i < 5; i++) {
            particles.push({
              x: x - 10 + (Math.random() * 6 - 3),
              y: y + (Math.random() * 8 - 4),
              vx: -(Math.random() * 1.5 + 0.8),
              vy: Math.random() * 2 - 1,
              size: Math.random() * 3 + 2,
              alpha: 0.85,
              color: '#ffffff',
            });
          }
        }

        function createScoreSparkles(x, y) {
          for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * 2.5 + 1.2;
            particles.push({
              x: x,
              y: y,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd,
              size: Math.random() * 3 + 2,
              alpha: 1,
              color: '#fef08a',
            });
          }
        }

        // --- GAME OBJECTS ---
        const bird = {
          x: BIRD_X,
          y: 260,
          vy: 0,
          rotation: 0,
          wingPhase: 0,
          dead: false,
          hitGround: false,

          reset: function () {
            this.x = BIRD_X;
            this.y = 260;
            this.vy = 0;
            this.rotation = 0;
            this.wingPhase = 0;
            this.dead = false;
            this.hitGround = false;
          },

          flap: function () {
            if (this.dead) return;
            this.vy = JUMP_VELOCITY;
            this.rotation = -0.42; // ~ -24 deg
            createFeatherPuff(this.x, this.y);
            playFlapSound();
          },

          update: function () {
            if (currentState === STATE.START) {
              // Idle bobbing
              this.y = 260 + Math.sin(frameCount * 0.08) * 7;
              this.rotation = 0;
              this.wingPhase += 0.22;
              return;
            }

            // Gravity & velocity
            this.vy += GRAVITY;
            if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
            this.y += this.vy;

            // Smooth rotation based on velocity
            if (this.vy < 0) {
              this.rotation = -0.42; // Upward flap angle
            } else {
              // Gradually pitch downward up to +75 degrees
              this.rotation += 0.045;
              if (this.rotation > 1.3) this.rotation = 1.3;
            }

            // Wing flap animation speed
            if (!this.dead) {
              this.wingPhase += this.vy < 0 ? 0.35 : 0.15;
            }

            // Ceiling collision check
            if (this.y - BIRD_RADIUS <= 0) {
              this.y = BIRD_RADIUS;
              this.vy = 0;
            }

            // Ground collision check
            if (this.y + BIRD_RADIUS >= GROUND_Y) {
              this.y = GROUND_Y - BIRD_RADIUS;
              if (!this.hitGround) {
                this.hitGround = true;
                if (!this.dead) {
                  triggerGameOver();
                }
              }
            }
          },

          draw: function () {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);

            // Wing animation offset (-1, 0, 1)
            const wingAnim = Math.sin(this.wingPhase);

            // --- BIRD BODY ---
            // Drop shadow under bird
            ctx.beginPath();
            ctx.ellipse(-1, 3, 14, 11, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
            ctx.fill();

            // Main round body (Classic Flappy Yellow)
            ctx.beginPath();
            ctx.ellipse(0, 0, 14, 11, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#f6be00';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#382200';
            ctx.stroke();

            // Belly highlight (soft creamy bottom)
            ctx.beginPath();
            ctx.ellipse(-1, 4, 10, 5, 0, 0, Math.PI);
            ctx.fillStyle = '#fde047';
            ctx.fill();

            // Pink cheek blush
            ctx.beginPath();
            ctx.ellipse(3, 3, 3.5, 2.5, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(248, 113, 113, 0.65)';
            ctx.fill();

            // --- EYE ---
            // White eye sphere
            ctx.beginPath();
            ctx.arc(6, -4, 5.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 1.6;
            ctx.strokeStyle = '#382200';
            ctx.stroke();

            // Black pupil
            ctx.beginPath();
            ctx.arc(8, -4, 2.4, 0, Math.PI * 2);
            ctx.fillStyle = '#0f172a';
            ctx.fill();

            // Pupil white reflection glint
            ctx.beginPath();
            ctx.arc(9, -5, 0.9, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // --- BEAK ---
            // Large cartoon orange lips
            ctx.beginPath();
            ctx.moveTo(8, -1);
            ctx.lineTo(19, 1);
            ctx.lineTo(8, 7);
            ctx.closePath();
            ctx.fillStyle = '#f97316';
            ctx.fill();
            ctx.lineWidth = 1.6;
            ctx.strokeStyle = '#382200';
            ctx.stroke();

            // Center mouth line
            ctx.beginPath();
            ctx.moveTo(9, 2.5);
            ctx.lineTo(17, 1.5);
            ctx.strokeStyle = '#9a3412';
            ctx.lineWidth = 1.4;
            ctx.stroke();

            // --- WING ---
            ctx.save();
            ctx.translate(-5, 1);
            const wingAngle = wingAnim * 0.45;
            ctx.rotate(wingAngle);

            ctx.beginPath();
            ctx.ellipse(-3, 0, 7.5, 4.5, -0.15, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 1.6;
            ctx.strokeStyle = '#382200';
            ctx.stroke();

            // Inner feather curve
            ctx.beginPath();
            ctx.ellipse(-3, 0.5, 5, 2.8, -0.1, 0, Math.PI * 2);
            ctx.fillStyle = '#fef08a';
            ctx.fill();
            ctx.restore();

            ctx.restore();
          },
        };

        // --- PIPES ---
        let pipes = [];

        function spawnPipe(x) {
          // Keep gap in safe playable vertical zone
          const minGapTop = 80;
          const maxGapTop = GROUND_Y - PIPE_GAP - 80;
          const topHeight = Math.floor(Math.random() * (maxGapTop - minGapTop + 1)) + minGapTop;
          pipes.push({
            x: x,
            topHeight: topHeight,
            bottomY: topHeight + PIPE_GAP,
            passed: false,
          });
        }

        function resetPipes() {
          pipes = [];
          spawnPipe(WIDTH + 140);
          spawnPipe(WIDTH + 140 + PIPE_INTERVAL);
        }

        function drawPipe(x, topHeight, bottomY) {
          // --- TOP PIPE (Shaft & Collar) ---
          drawPipeSegment(x, 0, topHeight - PIPE_COLLAR_HEIGHT, false);
          drawPipeCollar(x, topHeight - PIPE_COLLAR_HEIGHT, PIPE_COLLAR_HEIGHT, false);

          // --- BOTTOM PIPE (Collar & Shaft) ---
          drawPipeCollar(x, bottomY, PIPE_COLLAR_HEIGHT, true);
          drawPipeSegment(x, bottomY + PIPE_COLLAR_HEIGHT, GROUND_Y - (bottomY + PIPE_COLLAR_HEIGHT), true);
        }

        function drawPipeSegment(x, y, height, isBottom) {
          if (height <= 0) return;
          ctx.save();

          // Main body gradient (Retro 3D Arcade green)
          const grad = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
          grad.addColorStop(0, '#539e24'); // Left base green
          grad.addColorStop(0.12, '#8fe03c'); // Bright highlight streak
          grad.addColorStop(0.35, '#73bf2e'); // Classic mid green
          grad.addColorStop(0.75, '#539e24'); // Shading
          grad.addColorStop(1, '#356a14'); // Dark shadow edge

          ctx.fillStyle = grad;
          ctx.fillRect(x, y, PIPE_WIDTH, height);

          // Dark outer stroke
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#1b3b07';
          ctx.strokeRect(x, y, PIPE_WIDTH, height);

          ctx.restore();
        }

        function drawPipeCollar(x, y, height, isBottom) {
          ctx.save();
          const collarX = x - (PIPE_COLLAR_WIDTH - PIPE_WIDTH) / 2;

          const grad = ctx.createLinearGradient(collarX, 0, collarX + PIPE_COLLAR_WIDTH, 0);
          grad.addColorStop(0, '#59aa27');
          grad.addColorStop(0.12, '#99ec42');
          grad.addColorStop(0.35, '#78c632');
          grad.addColorStop(0.75, '#539e24');
          grad.addColorStop(1, '#326512');

          ctx.fillStyle = grad;
          ctx.fillRect(collarX, y, PIPE_COLLAR_WIDTH, height);

          ctx.lineWidth = 2;
          ctx.strokeStyle = '#1b3b07';
          ctx.strokeRect(collarX, y, PIPE_COLLAR_WIDTH, height);

          // Bevel / shadow edge under or over rim
          ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
          if (!isBottom) {
            // Shadow on bottom rim of top pipe
            ctx.fillRect(collarX + 1, y + height - 3, PIPE_COLLAR_WIDTH - 2, 2);
          } else {
            // Shadow on top rim of bottom pipe
            ctx.fillRect(collarX + 1, y + 1, PIPE_COLLAR_WIDTH - 2, 2);
          }

          ctx.restore();
        }

        // --- COLLISION DETECTION ---
        // Circle to Box intersection
        function circleBoxCollision(cx, cy, radius, rx, ry, rw, rh) {
          const closestX = Math.max(rx, Math.min(cx, rx + rw));
          const closestY = Math.max(ry, Math.min(cy, ry + rh));
          const dx = cx - closestX;
          const dy = cy - closestY;
          return dx * dx + dy * dy < radius * radius;
        }

        function checkCollisions() {
          // Bird radius with slight friendly tolerance (11px instead of 13px) for super fair gameplay
          const r = BIRD_RADIUS - 1.5;

          for (let i = 0; i < pipes.length; i++) {
            const p = pipes[i];

            // 1. Top pipe shaft
            if (circleBoxCollision(bird.x, bird.y, r, p.x, 0, PIPE_WIDTH, p.topHeight - PIPE_COLLAR_HEIGHT)) {
              return true;
            }
            // 2. Top pipe collar
            const collarX = p.x - (PIPE_COLLAR_WIDTH - PIPE_WIDTH) / 2;
            if (
              circleBoxCollision(
                bird.x,
                bird.y,
                r,
                collarX,
                p.topHeight - PIPE_COLLAR_HEIGHT,
                PIPE_COLLAR_WIDTH,
                PIPE_COLLAR_HEIGHT,
              )
            ) {
              return true;
            }

            // 3. Bottom pipe collar
            if (
              circleBoxCollision(bird.x, bird.y, r, collarX, p.bottomY, PIPE_COLLAR_WIDTH, PIPE_COLLAR_HEIGHT)
            ) {
              return true;
            }
            // 4. Bottom pipe shaft
            if (
              circleBoxCollision(
                bird.x,
                bird.y,
                r,
                p.x,
                p.bottomY + PIPE_COLLAR_HEIGHT,
                PIPE_WIDTH,
                GROUND_Y - (p.bottomY + PIPE_COLLAR_HEIGHT),
              )
            ) {
              return true;
            }
          }
          return false;
        }

        function triggerGameOver() {
          if (currentState === STATE.GAMEOVER) return;

          currentState = STATE.GAMEOVER;
          gameOverTime = Date.now();
          bird.dead = true;
          shakeFrames = 18;
          flashAlpha = 0.75;

          playHitSound();
          setTimeout(function () {
            if (bird.y < GROUND_Y - BIRD_RADIUS) {
              playDieSound();
            }
          }, 90);

          if (score > highScore) {
            highScore = score;
            isNewHigh = true;
            localStorage.setItem('flappy_best_score', highScore.toString());
          } else {
            isNewHigh = false;
          }
        }

        // --- DRAWING ENVIRONMENT ---
        function drawBackground() {
          // Sky gradient
          const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
          skyGrad.addColorStop(0, '#4ec0ca');
          skyGrad.addColorStop(0.7, '#79d1d9');
          skyGrad.addColorStop(1, '#a1e4eb');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, WIDTH, GROUND_Y);

          // Distant Clouds
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          for (let i = 0; i < clouds.length; i++) {
            const c = clouds[i];
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.scale(c.scale, c.scale);

            // Cloud puffs
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.arc(14, -6, 20, 0, Math.PI * 2);
            ctx.arc(32, -4, 18, 0, Math.PI * 2);
            ctx.arc(46, 0, 14, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();

            // Cloud base flat shadow
            ctx.beginPath();
            ctx.ellipse(23, 2, 34, 7, 0, 0, Math.PI);
            ctx.fillStyle = 'rgba(215, 238, 241, 0.9)';
            ctx.fill();

            ctx.restore();
          }

          // Distant City / Mountain Skyline (Parallax)
          ctx.save();
          ctx.translate(-(cityOffset % 240), 0);

          for (let repeat = -1; repeat <= 2; repeat++) {
            const offsetX = repeat * 240;

            // Distant hills/trees
            ctx.fillStyle = '#9fe0c9';
            ctx.beginPath();
            ctx.arc(offsetX + 30, GROUND_Y - 20, 60, Math.PI, 0);
            ctx.arc(offsetX + 120, GROUND_Y - 15, 75, Math.PI, 0);
            ctx.arc(offsetX + 200, GROUND_Y - 18, 55, Math.PI, 0);
            ctx.fill();

            // Distant buildings
            ctx.fillStyle = '#b7e4d8';
            ctx.fillRect(offsetX + 10, GROUND_Y - 80, 26, 80);
            ctx.fillRect(offsetX + 42, GROUND_Y - 110, 30, 110);
            ctx.fillRect(offsetX + 76, GROUND_Y - 70, 24, 70);
            ctx.fillRect(offsetX + 108, GROUND_Y - 95, 36, 95);
            ctx.fillRect(offsetX + 150, GROUND_Y - 75, 28, 75);
            ctx.fillRect(offsetX + 185, GROUND_Y - 120, 32, 120);

            // Building windows
            ctx.fillStyle = '#def5ee';
            for (let b = 0; b < 4; b++) {
              ctx.fillRect(offsetX + 48, GROUND_Y - 100 + b * 18, 5, 8);
              ctx.fillRect(offsetX + 60, GROUND_Y - 100 + b * 18, 5, 8);
              ctx.fillRect(offsetX + 192, GROUND_Y - 110 + b * 18, 5, 8);
              ctx.fillRect(offsetX + 204, GROUND_Y - 110 + b * 18, 5, 8);
            }
          }
          ctx.restore();
        }

        function drawGround() {
          ctx.save();
          // Dirt base
          ctx.fillStyle = '#ddd894';
          ctx.fillRect(0, GROUND_Y, WIDTH, HEIGHT - GROUND_Y);

          // Diagonal scrolling stripes in dirt
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, GROUND_Y + 14, WIDTH, HEIGHT - (GROUND_Y + 14));
          ctx.clip();

          ctx.strokeStyle = '#ceca7d';
          ctx.lineWidth = 10;
          const stripeSpacing = 20;
          const shift = (groundOffset * 1.0) % stripeSpacing;

          for (let x = -stripeSpacing * 2; x < WIDTH + stripeSpacing * 2; x += stripeSpacing) {
            ctx.beginPath();
            ctx.moveTo(x - shift, GROUND_Y + 14);
            ctx.lineTo(x - shift - 18, HEIGHT);
            ctx.stroke();
          }
          ctx.restore();

          // Green Grass band at top of ground
          ctx.fillStyle = '#73bf2e';
          ctx.fillRect(0, GROUND_Y, WIDTH, 14);

          // Bright grass top highlight
          ctx.fillStyle = '#9fe855';
          ctx.fillRect(0, GROUND_Y, WIDTH, 3);

          // Dark grass underline
          ctx.fillStyle = '#549420';
          ctx.fillRect(0, GROUND_Y + 12, WIDTH, 2);

          // Ground top border
          ctx.strokeStyle = '#2d5815';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, GROUND_Y);
          ctx.lineTo(WIDTH, GROUND_Y);
          ctx.stroke();

          ctx.restore();
        }

        function drawParticles() {
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.035;

            if (p.alpha <= 0) {
              particles.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        // --- RETRO SCORE RENDERING ---
        function drawArcadeNumber(text, x, y, size, scale) {
          ctx.save();
          ctx.translate(x, y);
          if (scale && scale !== 1) {
            ctx.scale(scale, scale);
          }

          ctx.font = 'bold ' + size + 'px "Press Start 2P", monospace, system-ui';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Outer shadow & stroke
          ctx.lineWidth = Math.max(size * 0.2, 4);
          ctx.strokeStyle = '#000000';
          ctx.lineJoin = 'miter';
          ctx.strokeText(text, 0, 2);
          ctx.strokeText(text, 0, 0);

          // Main white face
          ctx.fillStyle = '#ffffff';
          ctx.fillText(text, 0, 0);

          ctx.restore();
        }

        // --- MEDAL RENDERING ---
        function drawMedal(x, y, type) {
          ctx.save();
          ctx.translate(x, y);

          // Medal ribbon
          ctx.beginPath();
          ctx.moveTo(-10, -22);
          ctx.lineTo(0, -6);
          ctx.lineTo(10, -22);
          ctx.fillStyle = '#ef4444';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#7f1d1d';
          ctx.stroke();

          let primary = '#cd7f32';
          let highlight = '#f6b26b';
          let border = '#783f04';

          if (type === 'platinum') {
            primary = '#93c5fd';
            highlight = '#ffffff';
            border = '#1e3a8a';
          } else if (type === 'gold') {
            primary = '#facc15';
            highlight = '#fef08a';
            border = '#854d0e';
          } else if (type === 'silver') {
            primary = '#cbd5e1';
            highlight = '#f8fafc';
            border = '#475569';
          }

          // Outer circle
          ctx.beginPath();
          ctx.arc(0, 0, 20, 0, Math.PI * 2);
          ctx.fillStyle = primary;
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = border;
          ctx.stroke();

          // Inner ring
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.fillStyle = highlight;
          ctx.fill();

          // Center Star
          ctx.fillStyle = border;
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
            const rInner = 5;
            const rOuter = 10;
            const x1 = Math.cos(angle) * rOuter;
            const y1 = Math.sin(angle) * rOuter;
            const angle2 = angle + Math.PI / 5;
            const x2 = Math.cos(angle2) * rInner;
            const y2 = Math.sin(angle2) * rInner;
            if (i === 0) ctx.moveTo(x1, y1);
            else ctx.lineTo(x1, y1);
            ctx.lineTo(x2, y2);
          }
          ctx.closePath();
          ctx.fill();

          // Sparkle glint on medal
          if (frameCount % 60 < 20) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(8, -12, 3, 3);
          }

          ctx.restore();
        }

        // --- SCREENS ---
        function drawStartScreen() {
          // Title Banner
          ctx.save();
          const titleY = 140 + Math.sin(frameCount * 0.05) * 4;

          ctx.font = 'bold 32px "Press Start 2P", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // 3D Extrusion Shadow
          ctx.fillStyle = '#22380d';
          for (let o = 6; o >= 1; o--) {
            ctx.fillText('FLAPPY BIRD', WIDTH / 2, titleY + o);
          }

          // Border outline
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#000000';
          ctx.strokeText('FLAPPY BIRD', WIDTH / 2, titleY);

          // Bright orange/gold gradient title face
          const titleGrad = ctx.createLinearGradient(0, titleY - 16, 0, titleY + 16);
          titleGrad.addColorStop(0, '#ffffff');
          titleGrad.addColorStop(0.3, '#fde047');
          titleGrad.addColorStop(1, '#f97316');
          ctx.fillStyle = titleGrad;
          ctx.fillText('FLAPPY BIRD', WIDTH / 2, titleY);

          // High Score Badge
          if (highScore > 0) {
            ctx.font = 'bold 12px "Press Start 2P", monospace';
            ctx.fillStyle = '#1e293b';
            ctx.fillText('BEST SCORE: ' + highScore, WIDTH / 2, 205);
          }

          // Flashing Instruction Prompt
          const flash = (Math.sin(frameCount * 0.09) + 1) / 2;
          ctx.globalAlpha = 0.4 + flash * 0.6;

          // Instruction panel
          ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
          roundRect(ctx, WIDTH / 2 - 130, 360, 260, 56, 12, true, false);

          ctx.font = 'bold 12px "Press Start 2P", monospace';
          ctx.fillStyle = '#ffffff';
          ctx.fillText('PRESS SPACE OR TAP', WIDTH / 2, 382);
          ctx.fillStyle = '#fef08a';
          ctx.fillText('TO FLAP', WIDTH / 2, 402);

          // Cute tap finger icon / arrow animation
          const tapY = 445 + Math.sin(frameCount * 0.12) * 6;
          ctx.font = '22px system-ui';
          ctx.fillText('👆', WIDTH / 2, tapY);

          ctx.restore();
        }

        function drawGameOverScreen() {
          ctx.save();

          // Slide-in animation for score board
          const elapsed = Date.now() - gameOverTime;
          const slideProgress = Math.min(elapsed / 320, 1.0);
          const easeOutBack = function (x) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
          };
          const animY = -120 + easeOutBack(slideProgress) * 290;

          // "GAME OVER" Text
          ctx.font = 'bold 28px "Press Start 2P", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // 3D Shadow
          ctx.fillStyle = '#450a0a';
          for (let o = 5; o >= 1; o--) {
            ctx.fillText('GAME OVER', WIDTH / 2, animY - 45 + o);
          }
          ctx.lineWidth = 5;
          ctx.strokeStyle = '#000000';
          ctx.strokeText('GAME OVER', WIDTH / 2, animY - 45);

          const goGrad = ctx.createLinearGradient(0, animY - 60, 0, animY - 30);
          goGrad.addColorStop(0, '#fecaca');
          goGrad.addColorStop(0.4, '#ef4444');
          goGrad.addColorStop(1, '#b91c1c');
          ctx.fillStyle = goGrad;
          ctx.fillText('GAME OVER', WIDTH / 2, animY - 45);

          // --- SCOREBOARD PANEL ---
          const boardW = 280;
          const boardH = 148;
          const boardX = (WIDTH - boardW) / 2;
          const boardY = animY;

          // Panel drop shadow
          ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
          roundRect(ctx, boardX + 4, boardY + 6, boardW, boardH, 10, true, false);

          // Panel border & brushed parchment base
          ctx.fillStyle = '#ded895';
          roundRect(ctx, boardX, boardY, boardW, boardH, 10, true, false);
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#54381e';
          roundRect(ctx, boardX, boardY, boardW, boardH, 10, false, true);

          // Inner panel border
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#fbf8cb';
          roundRect(ctx, boardX + 4, boardY + 4, boardW - 8, boardH - 8, 8, false, true);

          // Medal Slot (Left)
          ctx.fillStyle = '#c7be77';
          roundRect(ctx, boardX + 22, boardY + 42, 64, 64, 8, true, false);
          ctx.strokeStyle = '#8d7840';
          ctx.lineWidth = 2;
          roundRect(ctx, boardX + 22, boardY + 42, 64, 64, 8, false, true);

          ctx.font = 'bold 9px "Press Start 2P", monospace';
          ctx.fillStyle = '#8a5316';
          ctx.textAlign = 'center';
          ctx.fillText('MEDAL', boardX + 54, boardY + 28);

          // Award Medal based on score
          if (score >= 40) {
            drawMedal(boardX + 54, boardY + 74, 'platinum');
          } else if (score >= 30) {
            drawMedal(boardX + 54, boardY + 74, 'gold');
          } else if (score >= 20) {
            drawMedal(boardX + 54, boardY + 74, 'silver');
          } else if (score >= 10) {
            drawMedal(boardX + 54, boardY + 74, 'bronze');
          } else {
            // Empty groove
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.beginPath();
            ctx.arc(boardX + 54, boardY + 74, 18, 0, Math.PI * 2);
            ctx.fill();
          }

          // Scores (Right)
          ctx.textAlign = 'right';

          // SCORE header
          ctx.font = 'bold 9px "Press Start 2P", monospace';
          ctx.fillStyle = '#8a5316';
          ctx.fillText('SCORE', boardX + boardW - 20, boardY + 30);

          ctx.font = 'bold 18px "Press Start 2P", monospace';
          ctx.fillStyle = '#1e293b';
          ctx.fillText(score.toString(), boardX + boardW - 20, boardY + 56);

          // BEST header
          ctx.font = 'bold 9px "Press Start 2P", monospace';
          ctx.fillStyle = '#8a5316';
          ctx.fillText('BEST', boardX + boardW - 20, boardY + 88);

          ctx.font = 'bold 18px "Press Start 2P", monospace';
          ctx.fillStyle = '#1e293b';
          ctx.fillText(highScore.toString(), boardX + boardW - 20, boardY + 114);

          // "NEW!" Badge if high score achieved
          if (isNewHigh) {
            ctx.save();
            ctx.translate(boardX + boardW - 88, boardY + 86);
            ctx.rotate(-0.1);
            ctx.fillStyle = '#ef4444';
            roundRect(ctx, -20, -10, 40, 18, 4, true, false);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            roundRect(ctx, -20, -10, 40, 18, 4, false, true);

            ctx.font = 'bold 8px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('NEW', 0, 2);
            ctx.restore();
          }

          // Restart Prompt (After cooldown of 500ms)
          if (elapsed > 500) {
            const restartPulse = (Math.sin(frameCount * 0.1) + 1) / 2;
            ctx.globalAlpha = 0.5 + restartPulse * 0.5;

            // Restart button style
            ctx.fillStyle = '#1e293b';
            roundRect(ctx, WIDTH / 2 - 120, animY + 180, 240, 44, 8, true, false);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            roundRect(ctx, WIDTH / 2 - 120, animY + 180, 240, 44, 8, false, true);

            ctx.textAlign = 'center';
            ctx.font = 'bold 11px "Press Start 2P", monospace';
            ctx.fillStyle = '#fef08a';
            ctx.fillText('TAP OR SPACE', WIDTH / 2, animY + 198);
            ctx.fillStyle = '#ffffff';
            ctx.fillText('TO RESTART', WIDTH / 2, animY + 214);
          }

          ctx.restore();
        }

        function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.lineTo(x + width - radius, y);
          ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
          ctx.lineTo(x + width, y + height - radius);
          ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
          ctx.lineTo(x + radius, y + height);
          ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
          ctx.lineTo(x, y + radius);
          ctx.quadraticCurveTo(x, y, x + radius, y);
          ctx.closePath();
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        // --- GAME LOOP & UPDATES ---
        function handleInput() {
          getAudioContext();

          if (currentState === STATE.START) {
            currentState = STATE.PLAYING;
            bird.flap();
            return;
          }

          if (currentState === STATE.PLAYING) {
            bird.flap();
            return;
          }

          if (currentState === STATE.GAMEOVER) {
            // Check 500ms cooldown to avoid accidental double-clicks
            if (Date.now() - gameOverTime > 500) {
              restartGame();
            }
          }
        }

        function restartGame() {
          score = 0;
          scoreScale = 1.0;
          isNewHigh = false;
          bird.reset();
          resetPipes();
          currentState = STATE.PLAYING;
          bird.flap();
        }

        // User Input listeners
        window.addEventListener(
          'keydown',
          function (e) {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ') {
              e.preventDefault();
              handleInput();
            }
          },
          { passive: false },
        );

        canvas.addEventListener(
          'pointerdown',
          function (e) {
            e.preventDefault();
            handleInput();
          },
          { passive: false },
        );

        // Update loop
        function update() {
          frameCount++;

          // Cloud drift
          for (let i = 0; i < clouds.length; i++) {
            clouds[i].x -= clouds[i].speed;
            if (clouds[i].x < -100) {
              clouds[i].x = WIDTH + 60;
            }
          }

          // Ground & City parallax scrolling
          if (currentState !== STATE.GAMEOVER) {
            groundOffset += SPEED;
            cityOffset += 0.35;
          }

          // Update bird
          bird.update();

          // Update pipes
          if (currentState === STATE.PLAYING) {
            for (let i = 0; i < pipes.length; i++) {
              const p = pipes[i];
              p.x -= SPEED;

              // Scoring: Bird clears pipe center X
              if (!p.passed && bird.x > p.x + PIPE_WIDTH / 2) {
                p.passed = true;
                score++;
                scoreScale = 1.45;
                createScoreSparkles(bird.x, bird.y);
                playScoreSound();
              }
            }

            // Remove off-screen pipes
            if (pipes.length > 0 && pipes[0].x < -PIPE_COLLAR_WIDTH - 20) {
              pipes.shift();
            }

            // Spawn new pipes at consistent horizontal interval
            const lastPipe = pipes[pipes.length - 1];
            if (lastPipe && lastPipe.x < WIDTH + 140 - PIPE_INTERVAL) {
              spawnPipe(lastPipe.x + PIPE_INTERVAL);
            }

            // Collision check
            if (checkCollisions()) {
              triggerGameOver();
            }
          }

          // Score pop scale interpolation
          if (scoreScale > 1.0) {
            scoreScale -= 0.045;
            if (scoreScale < 1.0) scoreScale = 1.0;
          }

          // Screen shake decay
          if (shakeFrames > 0) {
            shakeFrames--;
          }

          // White flash decay
          if (flashAlpha > 0) {
            flashAlpha -= 0.08;
            if (flashAlpha < 0) flashAlpha = 0;
          }
        }

        // Render loop
        function render() {
          ctx.save();

          // Screen shake offset on game over impact
          if (shakeFrames > 0) {
            const shakeMag = shakeFrames * 0.7;
            const sx = (Math.random() - 0.5) * shakeMag;
            const sy = (Math.random() - 0.5) * shakeMag;
            ctx.translate(sx, sy);
          }

          // 1. Background
          drawBackground();

          // 2. Pipes
          if (currentState !== STATE.START) {
            for (let i = 0; i < pipes.length; i++) {
              const p = pipes[i];
              drawPipe(p.x, p.topHeight, p.bottomY);
            }
          }

          // 3. Ground
          drawGround();

          // 4. Particles
          drawParticles();

          // 5. Bird
          bird.draw();

          // 6. HUD / Active Score
          if (currentState === STATE.PLAYING) {
            drawArcadeNumber(score.toString(), WIDTH / 2, 70, 32, scoreScale);
          }

          // 7. Screens (Start / Game Over)
          if (currentState === STATE.START) {
            drawStartScreen();
          } else if (currentState === STATE.GAMEOVER) {
            drawGameOverScreen();
          }

          // 8. Impact Flash Overlay
          if (flashAlpha > 0) {
            ctx.fillStyle = 'rgba(255, 255, 255, ' + flashAlpha + ')';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
          }

          ctx.restore();
        }

        // Main game loop
        function loop() {
          update();
          render();
          requestAnimationFrame(loop);
        }

        // Init
        resetPipes();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
